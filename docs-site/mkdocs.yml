site_name: USMLE LLM Evaluation
site_description: Systematic evaluation of LLM performance on USMLE Step 1 and Step 2 CK questions
site_author: Stanley Nelavala & Blessie [Last Name]  # TODO: Replace [Last Name]
site_url: https://ssnelavala-masstcs.github.io/usmle-llm-eval/  # TODO: Replace ssnelavala-masstcs

repo_name: usmle-llm-eval
repo_url: https://github.com/ssnelavala-masstcs/usmle-llm-eval  # TODO: Replace ssnelavala-masstcs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Dataset: dataset.md
  - Models: models.md
  - Running Evaluation: running-evaluation.md
  - Analysis: analysis.md
  - Results: results.md
  - IMG Perspective: img-perspective.md
  - Contributing: contributing.md
  - FAQ: faq.md

copyright: Copyright &copy; 2025 Stanley Nelavala & Blessie [Last Name]  # TODO: Replace [Last Name]
